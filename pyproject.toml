[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "designdna"
dynamic = ["version"]
description = "Referans sitelerden tasarım sistemi çıkaran, ağırlıklarla harmanlayan ve üretime hazır çıktılar üreten CLI"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "typer>=0.12",
    "pydantic>=2.6",
    "playwright>=1.44",
    "jinja2>=3.1",
    "rich>=13.7",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
designdna = "designdna.cli:app"

[tool.setuptools.dynamic]
version = { attr = "designdna.__version__" }

[tool.setuptools.packages.find]
include = ["designdna*"]

[tool.setuptools.package-data]
"designdna.extractor" = ["js/*.js"]
"designdna.generators" = ["templates/*.j2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "browser: Chromium gerektiren test (tarayıcı yoksa otomatik skip)",
]
